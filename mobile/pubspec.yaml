name: inspectra
description: Мобильное приложение для инспекций производственной безопасности ЕХ:Инспектра-ИПБ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client & Networking
  http: ^1.2.0
  http_parser:
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # State Management
  provider: ^6.1.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Local Storage (Оффлайн-режим и кэш)
  sqflite: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^10.3.1

  # Camera & Media
  camera: ^0.12.0+2
  image_picker: ^1.1.2       # Камера + галерея
  image: ^4.2.0              # Сжатие, ресайз, EXIF
  flutter_image_compress: ^2.3.0  # Нативное сжатие (быстрее)
  exif: ^3.3.0               # Извлечение EXIF (GPS, дата)

  # QR Scanner
  mobile_scanner: ^7.4.0

  # Push Notifications (Firebase)
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

  # Geolocation (для EXIF фото)
  geolocator: ^14.0.3

  # UI & Utils
  cached_network_image: ^3.3.1
  intl: ^0.20.3
  uuid: ^4.3.3
  connectivity_plus: ^7.0.0
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  bloc_test: ^10.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# Конфигурация для генерации иконок
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"